[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devspan"
version = "0.1.0"
description = "MCP server for Systems/Repos/Tasks context management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Scott Mackey" }]
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.5",
    "python-frontmatter>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
devspan = "devspan.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devspan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
pythonpath = ["src"]
